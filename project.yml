name: SeijiKeizaiApp

options:
  # 英単語特訓・古文特訓・ITパスポート特訓と共通の組織プレフィクス
  bundleIdPrefix: com.eitango
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  SeijiKeizaiApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: SeijiKeizaiApp
        excludes:
          - "App/Info.plist"

    # `info:` は「指定パスにInfo.plistを生成する」指定であり、手書きのInfo.plistを
    # xcodegen generate のたびに上書きしてしまう（姉妹アプリでは実際に
    # CFBundleDisplayName / ITSAppUsesNonExemptEncryption がビルドから抜け落ちた）。
    # 既存のファイルをそのまま使わせるため INFOPLIST_FILE を直接指定する。
    settings:
      base:
        INFOPLIST_FILE: SeijiKeizaiApp/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.seikei
        # 日本語＋スペースの PRODUCT_NAME はバンドル名・モジュール名・ビルドパスに波及し、
        # テストターゲットの TEST_HOST 解決に失敗する。ホーム画面に出る名前は
        # Info.plist の CFBundleDisplayName が担うため、ここはASCIIで固定する。
        PRODUCT_NAME: SeijiKeizaiApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # TestFlightへ上げるたびにワークフローの実行番号で上書きする（同じ番号は再アップロードできない）
        CURRENT_PROJECT_VERSION: "1"
        # 証明書とProvisioning ProfileはApp Store Connect APIキー経由でXcodeに作らせる。
        # 手元にMacが無く、証明書を手動で書き出して秘密として持ち回ることができないため。
        DEVELOPMENT_TEAM: 5PT8D8SKN8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES

  SeijiKeizaiAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: SeijiKeizaiAppTests
      # シードの妥当性をテストから検証するため、JSONそのものをバンドルに含める
      - path: SeijiKeizaiApp/Resources/question_master_seed.json
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.seikei.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: SeijiKeizaiApp

  SeijiKeizaiAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: SeijiKeizaiAppUITests
      # UIテストは別プロセスで動くためアプリのモジュールを import できない。
      # 起動引数の綴りだけは両方に同じ定義を持たせ、片方だけ直して静かに壊れるのを防ぐ。
      - path: SeijiKeizaiApp/Common/UITestSupport.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eitango.seikei.uitests
        TEST_TARGET_NAME: SeijiKeizaiApp
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: SeijiKeizaiApp

schemes:
  SeijiKeizaiApp:
    build:
      targets:
        SeijiKeizaiApp: all
        SeijiKeizaiAppTests: [test]
        SeijiKeizaiAppUITests: [test]
    # App内課金を持たないため storeKitConfiguration は不要
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeijiKeizaiAppTests
        - SeijiKeizaiAppUITests
    archive:
      config: Release
